---
# This role assumes Docker is already installed on the system (the
# docker role, run first — see easyappointments.playbook.yml). Unlike
# this repo's Postgres-backed app roles, there's no separate shared-DB
# role to run beforehand — the database is bundled in this role's own
# compose stack (see defaults/main.yml for why).

- name: Easy!Appointments | Assert required secrets and base URL are set
  ansible.builtin.assert:
    that:
      - easyappointments_base_url | length > 0
      - easyappointments_db_password | length > 0
      - easyappointments_db_root_password | length > 0
    fail_msg: >
      One or more required Easy!Appointments variables are unset
      (easyappointments_base_url, easyappointments_db_password,
      easyappointments_db_root_password). Source the secrets through
      group_vars/host_vars in your inventory repo before running this
      role — see defaults/main.yml.
  tags:
    - easyappointments

- name: Easy!Appointments | Assert social card checksum is set if URL is set
  ansible.builtin.assert:
    that:
      - easyappointments_social_card_sha256 | length > 0
    fail_msg: >
      easyappointments_social_card_url is set but
      easyappointments_social_card_sha256 is not — set the expected
      sha256 of that file so get_url can verify it on fetch.
  when: easyappointments_social_card_url | length > 0
  tags:
    - easyappointments

- name: Easy!Appointments | Create install directory
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/easyappointments
    - /opt/easyappointments/config
  tags:
    - easyappointments

# Bind-mounted read-only into the container (see docker-compose.yml.j2) to
# fix CodeIgniter's default ugly URLs (/index.php/login) and stop leaking
# the Apache version in error pages/the Server header — the upstream image
# ships neither an .htaccess nor mod_rewrite enabled by default. Deployed
# as plain files rather than baked into a custom image so this stays on
# the pinned upstream alextselegidis/easyappointments image.
- name: Easy!Appointments | Deploy Apache config (URL rewriting, hardening)
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/easyappointments/config/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - .htaccess
    - apache-hardening.conf
  tags:
    - easyappointments

# Same bind-mount mechanism as the Apache config above, but fetched
# from easyappointments_favicon_url rather than committed to this
# role's own files/ — a branded icon is deployment-specific content,
# not generic reusable boilerplate (see defaults/main.yml). Optional:
# skipped entirely if unset, in which case the compose template also
# skips the bind mount and the upstream default favicon is used.
# force: false (the module default) means this only downloads once,
# not on every run — re-fetching a static brand asset every apply
# isn't needed and would make this task always report changed.
- name: Easy!Appointments | Fetch custom favicon
  become: true
  ansible.builtin.get_url:
    url: "{{ easyappointments_favicon_url }}"
    dest: /opt/easyappointments/config/favicon.ico
    owner: root
    group: root
    mode: "0644"
  when: easyappointments_favicon_url | length > 0
  tags:
    - easyappointments

# Same bind-mount mechanism as the favicon above, but for the Open Graph
# preview image (see defaults/main.yml). checksum verifies the fetched
# file matches easyappointments_social_card_sha256 — this URL points at
# the live public site rather than a private inventory host, so pin the
# hash rather than trusting whatever the URL returns. force: false means
# this only re-fetches if the checksum no longer matches what's on disk,
# not on every run.
- name: Easy!Appointments | Fetch custom social card
  become: true
  ansible.builtin.get_url:
    url: "{{ easyappointments_social_card_url }}"
    dest: /opt/easyappointments/config/social-card.png
    checksum: "sha256:{{ easyappointments_social_card_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: easyappointments_social_card_url | length > 0
  tags:
    - easyappointments

- name: Easy!Appointments | Install Docker Compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/easyappointments/docker-compose.yml
    owner: root
    group: root
    mode: "0600" # env block carries secrets in plaintext
  tags:
    - easyappointments

- name: Easy!Appointments | Deploy via Docker Compose
  become: true
  community.docker.docker_compose_v2:
    project_src: /opt/easyappointments
    state: present
  register: easyappointments_compose
  tags:
    - easyappointments

# ----------------------------------------------------------------- #
# Scheduled calendar sync. See defaults/main.yml for why this exists
# and the README's "Scheduled calendar sync" section for the full
# story — systemd timer, not cron, matching this repo's convention
# (restic, freebusy-sync).
# ----------------------------------------------------------------- #

- name: Easy!Appointments | Template the sync systemd service
  become: true
  ansible.builtin.template:
    src: easyappointments-sync.service.j2
    dest: /etc/systemd/system/easyappointments-sync.service
    owner: root
    group: root
    mode: "0644"
  when: easyappointments_sync_enabled
  tags:
    - easyappointments

- name: Easy!Appointments | Template the sync systemd timer
  become: true
  ansible.builtin.template:
    src: easyappointments-sync.timer.j2
    dest: /etc/systemd/system/easyappointments-sync.timer
    owner: root
    group: root
    mode: "0644"
  when: easyappointments_sync_enabled
  tags:
    - easyappointments

- name: Easy!Appointments | Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: easyappointments_sync_enabled
  tags:
    - easyappointments

- name: Easy!Appointments | Enable and start the sync timer
  become: true
  ansible.builtin.systemd:
    name: easyappointments-sync.timer
    enabled: true
    state: started
  when: easyappointments_sync_enabled
  tags:
    - easyappointments

# Real correctness check, not just "did systemctl start exit 0" — call
# the console command directly through the same docker exec path the
# timer uses and inspect its actual output. docker_container_exec does
# NOT fail the task on a non-zero exit code on its own (unlike
# ansible.builtin.command), so rc has to be checked explicitly. The
# text check on top of that guards against CodeIgniter's console
# command reporting rc 0 after catching a PHP fatal error internally —
# same "exit code says success, nothing actually happened" trap as
# odoo's wkhtmltopdf decoy package (see that role's README).
- name: Easy!Appointments | Run the sync now and verify it actually ran
  become: true
  community.docker.docker_container_exec:
    container: easyappointments-app
    command: php index.php console sync
    chdir: /var/www/html
  register: easyappointments_sync_check
  when: easyappointments_sync_enabled
  tags:
    - easyappointments

- name: Easy!Appointments | Assert the sync command ran cleanly
  ansible.builtin.assert:
    that:
      - easyappointments_sync_check.rc == 0
      - "'fatal error' not in easyappointments_sync_check.stdout | lower"
      - "'fatal error' not in easyappointments_sync_check.stderr | lower"
    fail_msg: >
      php index.php console sync did not run cleanly inside
      easyappointments-app (rc={{ easyappointments_sync_check.rc }},
      stdout: {{ easyappointments_sync_check.stdout }}, stderr:
      {{ easyappointments_sync_check.stderr }}) — check `docker logs
      easyappointments-app` before trusting the timer to run this on
      schedule.
  when: easyappointments_sync_enabled
  tags:
    - easyappointments
