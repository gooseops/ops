---
# Odoo version. Matches the nightly.odoo.com repo path
# (nightly.odoo.com/{{ odoo_version }}/nightly/deb/) and the docs URL to
# check before bumping: odoo.com/documentation/{{ odoo_version }}/
# administration/on_premise/packages.html — confirm the target OS is
# still listed as supported for that version's .deb before changing this.
odoo_version: "19.0"

# ----------------------------------------------------------------- #
# wkhtmltopdf ("wkhtmltox") — Odoo's PDF report rendering engine.
# ----------------------------------------------------------------- #
# THIS IS THE PART THAT BIT US LAST TIME. Read this whole block before
# touching it.
#
# Odoo needs the "with patched qt" wkhtmltopdf build, not the plain one
# some distros ship under the same package name (the unpatched build
# silently drops several rendering flags Odoo relies on). The patched
# build is NOT in Debian/Ubuntu's own repos — it's distributed as a
# separate .deb per OS release from github.com/wkhtmltopdf/packaging,
# one build per codename (bookworm, trixie, jammy, noble, ...).
#
# The failure mode if you get this wrong: installing a .deb built for
# the WRONG codename (e.g. an old bionic/focal build on a noble host)
# declares dependencies on library versions that plain `apt install`
# can't satisfy on the newer host — that's the "fontconfig/
# libjpeg62-turbo/libx11-6/libxcb1/libxext6/libxrender1/xfonts-75dpi/
# xfonts-base not installable" wall this repo hit before. It looks like
# "this OS is too new for wkhtmltopdf" but it's actually just "wrong
# .deb for this OS" — the fix is matching the .deb to the codename
# (this role does that automatically via ansible_distribution_release),
# not downgrading the OS.
#
# Pin version+release string exactly as published at
# github.com/wkhtmltopdf/packaging/releases — verify this is still the
# latest before bumping.
odoo_wkhtmltopdf_version: "0.12.6.1-3"

# Codenames this role has confirmed working .deb builds for. The role
# asserts ansible_distribution_release is in this list before
# attempting the download — fails loud with a pointer to the releases
# page instead of silently trying (and possibly failing the same way
# as before) on an unverified codename. Extend this list only after
# confirming a matching .deb actually exists at the URL below for the
# new codename.
odoo_wkhtmltopdf_supported_releases:
  - bookworm # Debian 12
  - trixie # Debian 13
  - jammy # Ubuntu 22.04
  - noble # Ubuntu 24.04 — Odoo's own currently-documented supported platform

# Runtime libraries the patched Qt build needs — install these via
# normal apt BEFORE the wkhtmltox .deb, from whatever current versions
# the host's own repos carry (the .deb's own dependency declarations
# are satisfied against these once they're present; installing the
# .deb first, with none of these already on the box, is what surfaces
# as an "unresolvable" dependency chain instead of a normal apt install).
odoo_wkhtmltopdf_prereq_packages:
  - fontconfig
  - libfontconfig1
  - libjpeg62-turbo
  - libxrender1
  - xfonts-75dpi
  - xfonts-base

# ----------------------------------------------------------------- #
# Postgres connection — external, shared host. Same pattern as every
# other app role in this repo (authentik, synapse, vaultwarden,
# mattermost): this role does not create a database. Run the shared
# postgresql role against your DB host with an "odoo" entry in
# postgresql_databases/postgresql_users/postgresql_hba_entries first
# (already present in this homelab's group_vars/postgresql.yml as of
# this writing — ODOO_POSTGRESQL_* — confirm it's still current before
# relying on it).
# ----------------------------------------------------------------- #
odoo_postgres_host: ""
odoo_postgres_port: 5432
odoo_postgres_database: "" # Odoo can also manage multiple DBs per instance; this is the default db_name in odoo.conf
odoo_postgres_user: ""
odoo_postgres_password: ""

# ----------------------------------------------------------------- #
# Secrets / config. Empty placeholders on purpose — never a real
# default, never a lookup('env', ...) in this file. Source through
# group_vars/host_vars in your inventory repo.
# ----------------------------------------------------------------- #
# Master password gating Odoo's database management screens
# (create/drop/duplicate/restore databases) — NOT a per-user login
# password. Treat it like any other root-adjacent credential.
odoo_admin_passwd: ""

odoo_http_port: 8069
# 0 = dev/single-process mode. Set >0 for a multi-worker production
# deployment — this also needs longpolling_port tuning, not wired up
# by this role yet; see the README's "Multi-worker" section.
odoo_workers: 0
odoo_addons_path: "/usr/lib/python3/dist-packages/odoo/addons"
