---
- name: Odoo
  hosts: odoo
  roles:
    - role: odoo
    - role: nginx-base
    - role: nginx-proxy

## Odoo needs a reachable Postgres database + user before this play will
## come up healthy — run the postgresql role against your shared DB host
## separately (see postgresql.playbook.yml). This homelab's inventory
## repo already has ODOO_POSTGRESQL_* group_vars entries for this
## (added when the Odoo VM/db were first created manually) — confirm
## they're still current before relying on them.
##
## Does NOT include the docker role — Odoo installs as a native apt
## package (nightly.odoo.com), not a container, unlike most of this
## repo's other app roles.
